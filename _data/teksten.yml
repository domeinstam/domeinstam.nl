  naam: Health of Nature
  kern: Ervaring met handel, distributie en commerciële ontwikkeling van natuurlijke gezondheidsproducten.
  tekst: Health of Nature is een merk binnen de markt voor natuurlijke gezondheidsproducten, waarmee ik mij bezighoud. Met onder andere Natural Green Chlorella en Natural Blue Spirulina richt het merk zich op de distributie en commerciële ontwikkeling van voedingssupplementen.
