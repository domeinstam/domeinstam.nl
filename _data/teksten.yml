verhaal:
  titel: Mijn verhaal
  ondertitel: Van de winkelvloer naar webshops, merken en digitale toepassingen.
  inleiding: Mijn ondernemersloopbaan begon met een eigen drogisterij, die ik vanaf mijn 25e jarenlang heb gerund. Vanuit de fysieke detailhandel ontwikkelde ik mij verder in e-commerce, merkontwikkeling en digitale innovatie.
  hoofdstukken:
    - titel: De winkel
      tekst: 'Als gecertificeerd drogist met een eigen fysieke drogisterij legde ik de basis: kennis van de gezondheidsbranche en ondernemen in de praktijk.'
    - titel: De webshop
      tekst: 'Met Adviesdrogisterij.nl ging ik in 2014 online, tot ik de webshop in 2026 overdroeg. Daar was ik betrokken bij vrijwel alles: commercie en marketing, inkoop en leveranciers, logistiek, personeel, financiën, organisatie en IT.'
    - titel: De merken
      tekst: Met PhytoForsan en Health of Nature kwamen product- en merkontwikkeling, positionering, handel en distributie erbij.
    - titel: Digitale innovatie
      tekst: Nu zet ik technologie en AI in om processen te verbeteren en praktische toepassingen te bouwen, zoals Atempo, Restavia, Only Sun en Antwoorden Adviesdrogisterij.nl.
  verbindt_titel: Wat alles verbindt
  verbindt_alineas:
    - Mijn achtergrond ligt in de detailhandel, e-commerce en gezondheidsbranche, waarin ik inmiddels twintig jaar ervaring heb. Daarnaast beschik ik over een juridische opleiding en een brede praktische IT-achtergrond.
    - Ik combineer zakelijke, organisatorische en juridische inzichten met technologie om problemen te doorgronden, bedrijfsprocessen te verbeteren en nieuwe toepassingen te ontwikkelen.
    - Ik ben geen traditionele programmeur. Mijn kracht ligt in het herkennen van mogelijkheden, het verbinden van verschillende disciplines en het daadwerkelijk realiseren van praktische oplossingen.
    - Met Domein Stam ondersteun ik ondernemers en organisaties als sparringpartner, organisatieverbeteraar en hands-on professional.
  verbindt_slogan: Meedenken. Verbeteren. Realiseren.
  disciplines:
    - titel: Gezondheid
      tekst: Twintig jaar in de branche, gecertificeerd drogist.
    - titel: Ondernemerschap
      tekst: Commercie, inkoop, verkoop en leveranciers, met oog voor haalbaarheid.
    - titel: Organisatieverbetering
      tekst: Organisatieontwikkeling en efficiëntere bedrijfsprocessen.
    - titel: Juridische blik
      tekst: Oog voor regelgeving, verantwoordelijkheden, afspraken en risico's.
    - titel: IT & AI
      tekst: Een brede praktische IT-achtergrond; AI gericht ingezet.
    - titel: Hands-on
      tekst: Van eerste idee tot werkende toepassing.
