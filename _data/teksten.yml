      tekst: Staat jouw vraagstuk er niet tussen?
      link_naar_contact: Vertel het me gerust.
verhaal:
  titel: Mijn verhaal
  ondertitel: Van de winkelvloer naar webshops, merken en digitale toepassingen.
  inleiding: Mijn ondernemersloopbaan begon met een eigen drogisterij, die ik vanaf mijn 25e jarenlang heb gerund. Vanuit de fysieke detailhandel ontwikkelde ik mij verder in e-commerce, merkontwikkeling en digitale innovatie.
  hoofdstukken:
    - titel: De winkel
      tekst: 'Als gecertificeerd drogist met een eigen fysieke drogisterij legde ik de basis: kennis van de gezondheidsbranche en ondernemen in de praktijk.'
    - titel: De webshop
      tekst: 'Met Adviesdrogisterij.nl ging ik in 2014 online, tot ik de webshop in 2026 overdroeg. Ik was betrokken bij vrijwel alles, van commercie en inkoop tot logistiek, personeel en financiën. Gaandeweg verschoof mijn rol van uitvoeren naar organiseren en verbeteren: processen inrichten, structuur aanbrengen en de bedrijfsvoering beter laten lopen.'
    - titel: De merken
      tekst: Met PhytoForsan en Health of Nature kwamen product- en merkontwikkeling, positionering, handel en distributie erbij.
    - titel: Digitale innovatie
      tekst: 'Een brede, praktische IT-achtergrond bracht me bij automatisering en AI. Nu bouw ik toepassingen: voor het bedrijf, zoals Antwoorden Adviesdrogisterij.nl, en vanuit eigen interesse, zoals Atempo, Restavia en Only Sun.'
  verbindt_titel: Wat alles verbindt
  verbindt_alineas:
    - 'Mijn achtergrond is breed: ondernemen in detailhandel en e-commerce, een juridische opleiding en een praktische IT-achtergrond. Wat die kanten verbindt, is nieuwsgierigheid.'
    - Een vraagstuk laat me niet snel los. Ik wil begrijpen hoe iets in elkaar zit, waarom het vastloopt en wat er beter kan. Dat geldt voor een bedrijfsproces net zo goed als voor een nieuw onderwerp waar ik me in vastbijt.
    - Technologie spreekt me aan omdat je er ideeën snel mee kunt toetsen en omzetten in iets wat werkt. Ik ben geen traditionele programmeur, maar een IT-generalist die systemen begrijpt en technologie praktisch toepast. Mijn juridische opleiding zorgt dat ik ook let op afspraken, verantwoordelijkheden en risico's.
    - Zo komen zakelijk inzicht, organisatie, juridische zorgvuldigheid en technologie samen, met gezondheid als persoonlijke drijfveer.
  verbindt_slogan: Meedenken. Verbeteren. Realiseren.
  disciplines:
    - titel: Gezondheid
      tekst: Twintig jaar in de branche, gecertificeerd drogist.
    - titel: Ondernemerschap
      tekst: Commercie, inkoop, verkoop en leveranciers, met oog voor haalbaarheid.
    - titel: Organisatieverbetering
      tekst: Organisatieontwikkeling en efficiëntere bedrijfsprocessen.
    - titel: Juridische blik
      tekst: Oog voor regelgeving, verantwoordelijkheden, afspraken en risico's.
    - titel: IT & AI
      tekst: 'Een veelzijdige IT-generalist: systemen, automatisering en AI.'
    - titel: Hands-on
      tekst: Van eerste idee tot werkende toepassing.
gezondheid:
  titel: Gezondheid als rode draad
  alineas:
    - Gezondheid loopt als een rode draad door mijn leven en loopbaan. Twintig jaar in de gezondheidsbranche, waarvan vele jaren in de drogisterij, gaven me een brede basis in zelfzorg, gezondheidsproducten en voedingssupplementen.
    - 'Mijn belangstelling reikt verder dan het vak. Ook in mijn eigen tijd verdiep ik me in voeding, leefstijl en preventie, natuurgeneeswijzen, beweging, ademhaling en herstel. Vooral de samenhang boeit me: hoe het lichaam werkt en hoe die onderdelen op elkaar inwerken.'
    - Die nieuwsgierigheid zit ook in mijn digitale projecten. Met Atempo en Restavia onderzoek ik hoe technologie bewegen, herstel en ontspanning praktisch en toegankelijk kan maken. Het zijn eigen projecten in ontwikkeling, geen medische toepassingen.
  onderwerpen:
    - Voeding
    - Leefstijl & preventie
    - Natuurgeneeswijzen
    - Beweging
    - Ademhaling & ontspanning
    - Herstel
    - Gezondheid & technologie
