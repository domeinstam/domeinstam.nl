intro:
  kicker: Meedenken. Verbeteren. Realiseren.
  naam: Rens Stam
  ondertitel: Ondernemend. Analytisch. Praktisch.
  tekst: Ondernemen leerde ik op de winkelvloer van mijn eigen drogisterij. Daarna bouwde ik aan webshops, merken en digitale toepassingen, met gezondheid als rode draad. Mijn ervaring ligt in organisatieverbetering, bedrijfsvoering, commercie en IT. Ik doorgrond graag een probleem, breng structuur aan en verbeter hoe het werk loopt, en steek daarbij zelf de handen uit de mouwen.
  beschikbaar: ''
  knop_kennismaken: Kennismaken
  knop_helpen: Waarmee ik help
