healthofnature:
  labels: Gezondheid · Import & distributie · Merkontwikkeling
  naam: Health of Nature
  kern: Ervaring met handel, distributie en commerciële ontwikkeling van natuurlijke gezondheidsproducten.
  tekst: Vanuit Domein Stam houd ik mij bezig met Health of Nature, een merk binnen de markt voor natuurlijke gezondheidsproducten. Met onder andere Natural Green Chlorella en Spirulina richt het merk zich op de distributie en commerciële ontwikkeling van voedingssupplementen.
