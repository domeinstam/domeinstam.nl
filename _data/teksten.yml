  ondertitel: Van inzicht naar praktische verbetering.
  blokken:
    - titel: Het loopt organisatorisch vast
      tekst: Processen in kaart brengen, werk opnieuw inrichten en verbeteringen ook echt doorvoeren. In een vaste rol of als tijdelijke versterking.
      link_naar_contact: ''
