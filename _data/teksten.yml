  kicker: Meedenken. Verbeteren. Realiseren.
  naam: Rens Stam
  ondertitel: Ondernemend. Organisator. Probleemoplosser.
  tekst: Ondernemen leerde ik op de winkelvloer van mijn eigen drogisterij. Daarna bouwde ik aan webshops, merken en digitale toepassingen, met gezondheid als rode draad. Ik help ondernemers en organisaties om problemen te doorgronden, processen te verbeteren en nieuwe mogelijkheden te realiseren, en ga daarbij graag zelf aan de slag.
