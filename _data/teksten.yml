  naam: Antwoorden Adviesdrogisterij.nl
  slogan: Gezondheid · Ondernemerschap · AI · Digitale innovatie
  alineas:
    - Een digitale toepassing ter ondersteuning van de klantcommunicatie binnen Adviesdrogisterij.nl. Ontwikkeld vanuit jarenlange praktijkervaring in de drogisterij- en gezondheidsbranche, gecombineerd met kennis van bedrijfsvoering, klantcommunicatie en digitale technologie.
    - Het project laat zien hoe ik branchekennis, zakelijke inzichten en zorgvuldigheid combineer bij het ontwikkelen van praktische AI-oplossingen.
  slot: Bestaande toepassing · alleen toegankelijk via inlogscherm
